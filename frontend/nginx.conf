# Equivalente di public/_redirects per l'immagine Docker di produzione:
# ogni rotta non trovata torna a index.html (routing SPA).
server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}

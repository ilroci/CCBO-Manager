# Blueprint Render (opzionale): crea entrambi i servizi in un colpo da
# Dashboard → New → Blueprint. I valori sync:false vanno inseriti a mano.
services:
  - type: web
    name: canoa-club-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Email della sezione Consigli (facoltative: senza, il form è disattivato)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SUGGESTIONS_TO
        value: giacomo.ceremeletti@gmail.com

  - type: web
    name: canoa-club-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # SPA: ogni percorso (es. /outings/123 ricaricato dal browser) serve index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
